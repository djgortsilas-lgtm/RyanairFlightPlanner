  } else {
    countEl.textContent = t('selectedCount', { n: selectedDestinations.size, m: allDestinations.length });
    if (actionsEl) actionsEl.style.display = '';
  }
}

/* --- Multi-Destination Search (single destination, cheapest via intermediate) --- */

async function searchMultiDestination() {
  try {
  if (isSearching) return;

  const dateFrom = document.getElementById('dateFrom').value;
  const dateTo = document.getElementById('dateTo').value;
  let minN = Math.max(1, Math.min(30, parseInt(document.getElementById('minNights').value) || 2));
  let maxN = Math.max(minN, Math.min(30, parseInt(document.getElementById('maxNights').value) || 5));
  const wk = document.getElementById('weekendOnly').checked;

  if (!dateFrom || !dateTo) return alert(t('pickDates'));
  if (!wheelOfFortuneMode && selectedDestinations.size === 0) return alert(t('pickDest'));

  const dFrom = new Date(dateFrom + 'T00:00:00');
  const dTo = new Date(dateTo + 'T00:00:00');
  if (dFrom >= dTo) return alert(t('dateOrder'));

  const origin = currentOrigin;
  const destList = wheelOfFortuneMode
    ? MASTER_AIRPORTS.filter(a => a.code !== origin).map(a => a.code)
    : [...selectedDestinations];

  wheelFilterDest = 'ALL';
  wheelFilterNights = 'ALL';
  wheelFilterWait = 'ALL';
  searchCancelled = false;

  isSearching = true;
  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = t('searching');

  setCacheDot('loading', t('fetchingRoutes'));
  const content = document.getElementById('resultsContent');
  content.innerHTML = `<div class="loading"><div class="spinner"></div><div class="progress-text" id="progText">${t('fetchingAll')}</div><div class="progress-bar"><div class="progress-bar-fill" id="progBar" style="width:0%"></div></div><div style="margin-top:14px"><button class="btn btn-secondary" id="cancelBtn" onclick="cancelSearch()" style="padding:8px 20px;font-size:0.8rem">${t('cancel')}</button></div><div class="skel-wrap"><div class="skel skel-line"></div><div class="skel skel-card"></div><div class="skel skel-card"></div></div></div>`;
  document.getElementById('resultsInfo').textContent = '';

  const months = getMonthsInRange(dFrom, dTo);

  /* ---- PHASE 1: fetch all origin→I and I→origin to discover viable intermediates ---- */
  const allFares = {};
  let viableOutbound = new Set();
  let viableReturn = new Set();
  let phaseDone = 0;

  function updateProg(pct, msg) {
    const pt = document.getElementById('progText');
    const pb = document.getElementById('progBar');
    if (pt) pt.textContent = msg || `${t('fetching')} ${Math.round(pct)}%`;
    if (pb) pb.style.width = Math.min(100, pct) + '%';
  }

  async function ensureFares(from, to) {
    if (!allFares[from]) allFares[from] = {};
    if (allFares[from][to]) return allFares[from][to];
    const map = {};
    allFares[from][to] = map;
    for (const m of months) {
      try {
        const fares = await fetchFares(from, to, m);
        for (const f of fares) {
          const dt = new Date(f.day + 'T00:00:00');
          if (dt >= dFrom && dt <= dTo) {
            map[f.day] = {
              price: f.price.value,
              dep: f.departureDate ? f.departureDate.substring(11,16) : null,
              arr: f.arrivalDate ? f.arrivalDate.substring(11,16) : null
            };
          }
        }
      } catch (e) {}
    }
    return map;
  }

  /* pool excludes origin and all selected destinations */
  let pool = MASTER_AIRPORTS.filter(a => a.code !== origin && (wheelOfFortuneMode || !destList.includes(a.code)));
  if (!wheelOfFortuneMode && selectedIntermediates.size > 0) {
    pool = pool.filter(a => selectedIntermediates.has(a.code));
  }
  const poolSize = pool.length;
  const CONCURRENCY = 12;
  const ow = isOneWay();

  /* Phase 1: discover viable intermediates */
  async function discoverIntermediates(airport) {
    const code = airport.code;
    const outMap = await ensureFares(origin, code);
    if (Object.keys(outMap).length > 0) viableOutbound.add(code);
    if (!ow) {
      const retMap = await ensureFares(code, origin);
      if (Object.keys(retMap).length > 0) viableReturn.add(code);
    }
    phaseDone++;
    const pct = (phaseDone / poolSize) * 40;
    updateProg(pct, `${t('scanning')}: ${phaseDone}/${poolSize}`);
  }

  for (let i = 0; i < pool.length; i += CONCURRENCY) {
    if (searchCancelled) break;
    const batch = pool.slice(i, i + CONCURRENCY);
    await Promise.allSettled(batch.map(discoverIntermediates));
  }
  if (searchCancelled) return finishCancelled();

  /* ---- Per-destination: Phases 2 + 3 ---- */
  const allResults = [];
  const totalDests = destList.length;

  for (let di = 0; di < totalDests; di++) {
    if (searchCancelled) return finishCancelled();
    const destCode = destList[di];
    const destInfo = allDestinations.find(d => d.code === destCode);
    const destName = destInfo ? cityName(destCode, destInfo.city) : destCode;

    const outCandidates = [...viableOutbound].filter(c => c !== destCode);
    const retCandidates = ow ? [] : [...viableReturn].filter(c => c !== destCode);

    /* Phase 2: fetch I→Dest and Dest→I */
    const phase2Base = 40 + (di / totalDests) * 50;
    function phase2Pct(n, total) {
      updateProg(phase2Base + (n / total) * (50 / totalDests), `[${di+1}/${totalDests}] ${destName}: ${t('connecting')} ${n}/${total}`);
    }
    let ph2Done = 0;
    const totalPh2 = outCandidates.length + retCandidates.length;
    if (totalPh2 === 0) { updateProg(phase2Base + 50 / totalDests, `[${di+1}/${totalDests}] ${destName}`); }
    const batchOut = outCandidates.map(c => async () => { await ensureFares(c, destCode); ph2Done++; phase2Pct(ph2Done, totalPh2); });
    const batchRet = retCandidates.map(c => async () => { await ensureFares(destCode, c); ph2Done++; phase2Pct(ph2Done, totalPh2); });
    const allTasks = [...batchOut, ...batchRet];
    for (let i = 0; i < allTasks.length; i += CONCURRENCY) {
      if (searchCancelled) return finishCancelled();
      await Promise.allSettled(allTasks.slice(i, i + CONCURRENCY).map(f => f()));
    }
    if (searchCancelled) return finishCancelled();

    /* Fetch direct fares for this destination */
    await ensureFares(origin, destCode);
    if (!ow) await ensureFares(destCode, origin);

    /* ---- PHASE 3: compute cheapest routes ---- */
    const directOutFares = allFares[origin]?.[destCode] || {};
    const directRetFares = allFares[destCode]?.[origin] || {};

    for (let d = new Date(dFrom); d <= dTo; d.setDate(d.getDate() + 1)) {
      if (searchCancelled) return finishCancelled();
      const ods = formatDate(d);
      const odNext = formatDate(addDays(d, 1));
      let bestOutCost = Infinity, bestOutRoute = null;

      const directOut = directOutFares[ods];
      if (directOut && !wheelOfFortuneMode) {
        bestOutCost = directOut.price;
        bestOutRoute = { type: 'direct', intCode: null, intCity: null, arrDate: ods, dep: directOut.dep, arr: directOut.arr, price: directOut.price, legs: 1 };
      }

      for (const ic of outCandidates) {
        const leg1 = allFares[origin]?.[ic]?.[ods];
        if (!leg1) continue;
        const leg2 = allFares[ic]?.[destCode]?.[ods];
        if (!leg2 || !connects(leg1.arr, leg2.dep)) continue;
        const total = leg1.price + leg2.price;
        if (total < bestOutCost) {
          bestOutCost = total;
          const iCity = getGreekName(ic, MASTER_AIRPORT_NAMES[ic] || ic);
          bestOutRoute = { type: 'via', intCode: ic, intCity: iCity, arrDate: ods, leg1Price: leg1.price, leg2Price: leg2.price, dep1: leg1.dep, arr1: leg1.arr, dep2: leg2.dep, arr2: leg2.arr, price: total, legs: 2 };
        }
      }

      if (odNext <= formatDate(addDays(dTo, 1))) {
        for (const ic of outCandidates) {
          const leg1 = allFares[origin]?.[ic]?.[ods];
          if (!leg1) continue;
          const leg2 = allFares[ic]?.[destCode]?.[odNext];
          if (!leg2) continue;
          const total = leg1.price + leg2.price;
          if (total < bestOutCost) {
            bestOutCost = total;
            const iCity = getGreekName(ic, MASTER_AIRPORT_NAMES[ic] || ic);
            bestOutRoute = { type: 'via1n', intCode: ic, intCity: iCity, arrDate: odNext, leg1Price: leg1.price, leg2Price: leg2.price, dep1: leg1.dep, arr1: leg1.arr, dep2: leg2.dep, arr2: leg2.arr, price: total, legs: 2 };
          }
        }
      }

      if (!bestOutRoute) continue;

      if (ow) {
        allResults.push({
          destCode, destName,
          outDate: ods, inDate: null, nights: 0,
          outRoute: bestOutRoute, retRoute: null,
          total: bestOutCost
        });
      } else {
        for (let rd = new Date(d); rd <= dTo; rd.setDate(rd.getDate() + 1)) {
          if (searchCancelled) return finishCancelled();
          const rds = formatDate(rd);
          const rPrev = formatDate(addDays(rd, -1));
          const nights = daysBetween(d, rd);
          if (nights < minN || nights > maxN) continue;
          if (wk && !coversWeekend(d, rd)) continue;

          let bestRetCost = Infinity, bestRetRoute = null;

          const directRet = directRetFares[rds];
          if (directRet && !wheelOfFortuneMode) {
            bestRetCost = directRet.price;
            bestRetRoute = { type: 'direct', intCode: null, intCity: null, depDate: rds, dep: directRet.dep, arr: directRet.arr, price: directRet.price, legs: 1 };
          }

          for (const ic of retCandidates) {
            const leg1 = allFares[destCode]?.[ic]?.[rds];
            if (!leg1) continue;
            const leg2 = allFares[ic]?.[origin]?.[rds];
            if (!leg2 || !connects(leg1.arr, leg2.dep)) continue;
            const total = leg1.price + leg2.price;
            if (total < bestRetCost) {
              bestRetCost = total;
              const iCity = getGreekName(ic, MASTER_AIRPORT_NAMES[ic] || ic);
              bestRetRoute = { type: 'via', intCode: ic, intCity: iCity, depDate: rds, leg1Price: leg1.price, leg2Price: leg2.price, dep1: leg1.dep, arr1: leg1.arr, dep2: leg2.dep, arr2: leg2.arr, price: total, legs: 2 };
            }
          }

          if (rPrev >= ods) {
            for (const ic of retCandidates) {
              const leg1 = allFares[destCode]?.[ic]?.[rPrev];
              if (!leg1) continue;
              const leg2 = allFares[ic]?.[origin]?.[rds];
              if (!leg2) continue;
              const total = leg1.price + leg2.price;
              if (total < bestRetCost) {
                bestRetCost = total;
                const iCity = getGreekName(ic, MASTER_AIRPORT_NAMES[ic] || ic);
                bestRetRoute = { type: 'via1n', intCode: ic, intCity: iCity, depDate: rPrev, leg1Price: leg1.price, leg2Price: leg2.price, dep1: leg1.dep, arr1: leg1.arr, dep2: leg2.dep, arr2: leg2.arr, price: total, legs: 2 };
              }
            }
          }

          if (!bestRetRoute) continue;

          allResults.push({
            destCode, destName,
            outDate: ods, inDate: rds, nights,
            outRoute: bestOutRoute, retRoute: bestRetRoute,
            total: bestOutCost + bestRetCost
          });
        }
      }
    }
  }

  if (searchCancelled) return finishCancelled();

  allResults.sort((a, b) => a.total - b.total);

  lastMultiDestPaths = allResults;
  lastMultiDestCityNames = MASTER_AIRPORT_NAMES;
  lastMultiDestDays = maxN;
  lastMultiDestOrigin = origin;
  if (wheelOfFortuneMode) {
    lastMultiDestDestCode = 'WHEEL';
    lastMultiDestDestName = t('wheelOfFortuneLabel');
  } else {
    lastMultiDestDestCode = destList.length === 1 ? destList[0] : destList.join(',');
    lastMultiDestDestName = destList.length === 1
      ? cityName(destList[0], allDestinations.find(d => d.code === destList[0])?.city || destList[0])
      : `${destList.length} ${currentLang === 'el' ? 'προορισμοί' : 'destinations'}`;
  }
  displayMultiDestResults(allResults, MASTER_AIRPORT_NAMES, maxN, origin);

  isSearching = false;
  btn.disabled = false;
  btn.textContent = t('search');
  setCacheDot('fresh', t('completed', { n: allResults.length }));
  } catch (e) {
    isSearching = false;
    const btn = document.getElementById('searchBtn');
    if (btn) { btn.disabled = false; btn.textContent = t('search'); }
    const content = document.getElementById('resultsContent');
    if (content) content.innerHTML = `<div class="error-msg">${t('error')}: ${e.message}</div>`;
    setCacheDot('empty', t('error'));
  }
}

function displayMultiDestResults(paths, cityNames, totalDays, origin) {
  const content = document.getElementById('resultsContent');
  const sns = document.getElementById('simpleNightsFilter');
  if (sns) sns.style.display = 'none';
  if (paths.length === 0) {
    content.innerHTML = `<div class="empty-msg"><div class="big-icon">&#128533;</div><p>${t('noRoutes')}</p></div>`;
    document.getElementById('resultsInfo').textContent = '';
    return;
  }
  const orgLabel = `${getOriginDisplayName(origin)} (${origin})`;
  const isWheel = lastMultiDestDestCode === 'WHEEL';
  const destLabel = isWheel
    ? lastMultiDestDestName
    : lastMultiDestDestCode && !lastMultiDestDestCode.includes(',')
      ? `${cityName(lastMultiDestDestCode, lastMultiDestDestName)} (${lastMultiDestDestCode})`
      : lastMultiDestDestName;

  const prevSort = (document.getElementById('sortSelect') || {}).value || 'cheapest';

  let html = `<div class="results-header"><h2 style="color:var(--pink)">${t('mcTitle', { org: orgLabel, dest: destLabel })}</h2><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="info">${t('foundRoutes', { n: paths.length })}</span>`;

  if (isWheel) {
    const destCodes = [...new Set(paths.map(p => p.destCode))].sort((a, b) => {
      const nameA = cityName(a, MASTER_AIRPORT_NAMES[a] || a).toLowerCase();
      const nameB = cityName(b, MASTER_AIRPORT_NAMES[b] || b).toLowerCase();
      return nameA.localeCompare(nameB);
    });
    html += `<select id="wheelDestFilter" onchange="filterWheelDest()" style="padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:0.85rem;outline:none;cursor:pointer"><option value="ALL">${t('wheelAllDests')} (${destCodes.length})</option>${destCodes.map(c => `<option value="${c}" ${wheelFilterDest === c ? 'selected' : ''}>${cityName(c, MASTER_AIRPORT_NAMES[c] || c)} (${c})</option>`).join('')}</select>`;
  }

  const nightsSet = [...new Set(paths.filter(p => p.nights > 0).map(p => p.nights))].sort((a, b) => a - b);
  if (nightsSet.length > 0) {
    html += `<select id="wheelNightsFilter" onchange="filterWheelNights()" style="padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:0.85rem;outline:none;cursor:pointer"><option value="ALL">${t('wheelAllNights')}</option>${nightsSet.map(n => `<option value="${n}" ${wheelFilterNights === String(n) ? 'selected' : ''}>${t('nightsShort', { n })}</option>`).join('')}</select>`;
  }

  html += `<select id="wheelWaitFilter" onchange="filterWheelWait()" style="padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:0.85rem;outline:none;cursor:pointer"><option value="ALL">${t('wheelWaitAll')}</option><option value="short" ${wheelFilterWait === 'short' ? 'selected' : ''}>${t('wheelWaitShort')}</option><option value="med" ${wheelFilterWait === 'med' ? 'selected' : ''}>${t('wheelWaitMed')}</option><option value="long" ${wheelFilterWait === 'long' ? 'selected' : ''}>${t('wheelWaitLong')}</option><option value="shortBoth" ${wheelFilterWait === 'shortBoth' ? 'selected' : ''}>${t('wheelWaitShortBoth')}</option><option value="medBoth" ${wheelFilterWait === 'medBoth' ? 'selected' : ''}>${t('wheelWaitMedBoth')}</option><option value="longBoth" ${wheelFilterWait === 'longBoth' ? 'selected' : ''}>${t('wheelWaitLongBoth')}</option></select>`;

  html += `<select id="sortSelect" onchange="reSortMultiDest()" style="padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:0.85rem;outline:none;cursor:pointer"><option value="cheapest"${prevSort === 'cheapest' ? ' selected' : ''}>${t('cheapestSort')}</option><option value="outdate"${prevSort === 'outdate' ? ' selected' : ''}>${t('depDate')}</option><option value="nights"${prevSort === 'nights' ? ' selected' : ''}>${t('nightsSort')}</option></select></div></div>`;

  if (isWheel) {
    const destBestMap = {};
    for (const p of paths) {
      if (!destBestMap[p.destCode] || p.total < destBestMap[p.destCode].total) {
        destBestMap[p.destCode] = { total: p.total, outDate: p.outDate, inDate: p.inDate, nights: p.nights };
      }
    }
    const top10 = Object.entries(destBestMap).sort((a, b) => a[1].total - b[1].total).slice(0, 10);

    if (top10.length > 0) {
      const allDates = new Set();
      for (const [, data] of top10) {
        if (data.outDate) allDates.add(data.outDate);
        if (data.inDate) allDates.add(data.inDate);
      }
      const calDates = [...allDates].sort();

      html += `<div class="cal-section"><h3 style="margin:16px 0 10px;font-size:1rem;color:var(--pink)">${t('wheelTop10')}</h3><div class="cal-scroll"><table class="cal-table"><thead><tr><th>${t('destCol')}</th>`;
      if (!isOneWay() && calDates.length > 0) {
        for (const d of calDates) {
          const day = new Date(d).getDay();
          const names = I18N.dayNames[currentLang];
          const cls = day === 0 || day === 6 ? ' cal-date-wknd' : '';
          html += `<th class="cal-date${cls}"><span class="day-name">${names[day]}</span>${fmtDate(d)}</th>`;
        }
      } else {
        html += `<th>${t('totalCol')}</th><th>${t('nightsCol')}</th>`;
      }
      html += `</tr></thead><tbody>`;

      const rtMap = {};
      for (const p of paths) {
        const key = p.destCode + '|' + p.outDate;
        if (!rtMap[key] || p.total < rtMap[key].total) rtMap[key] = { total: p.total, nights: p.nights, inDate: p.inDate };
      }

      for (let ti = 0; ti < top10.length; ti++) {
        const [code, data] = top10[ti];
        html += `<tr><td class="cal-dest" style="font-size:0.75rem">${ti + 1}. ${cityName(code, MASTER_AIRPORT_NAMES[code] || code)} (${code})</td>`;
        if (!isOneWay() && calDates.length > 0) {
          for (const d of calDates) {
            const rt = rtMap[code + '|' + d];
            if (rt) {
              let cls = 'cal-cell';
              if (rt.total === data.total) cls += ' cal-min';
              html += `<td class="${cls}" style="font-size:0.75rem">${Number(rt.total).toFixed(0).replace('.',',')}€<span class="cal-nights">${t('nightsShort', { n: rt.nights })}</span></td>`;
            } else {
              html += `<td class="cal-cell cal-empty">-</td>`;
            }
          }
        } else {
          html += `<td class="cal-cell cal-min" style="font-size:0.75rem">${Number(data.total).toFixed(0).replace('.',',')}€</td>`;
          html += `<td class="cal-cell" style="font-size:0.75rem">${data.nights || '-'}</td>`;
        }
        html += `</tr>`;
      }
      html += `</tbody></table></div></div>`;
    }
  }

  const filteredPaths = paths.filter(p => {
    if (isWheel && wheelFilterDest !== 'ALL' && p.destCode !== wheelFilterDest) return false;
    if (wheelFilterNights !== 'ALL' && String(p.nights) !== wheelFilterNights) return false;
    return true;
  });

  const finalPaths = wheelFilterWait !== 'ALL'
    ? filteredPaths.filter(p => {
        const outWait = getLegWait(p.outRoute);
        const retWait = getLegWait(p.retRoute);
        /* Χωρίς ανταπόκριση (απευθείας) δεν έχει νόημα το φίλτρο αναμονής */
        if (outWait === null && retWait === null) return false;
        const isBoth = wheelFilterWait.includes('Both');
        const base = wheelFilterWait.replace('Both', '');
        if (isBoth) {
          if (base === 'short' && ((outWait !== null && outWait >= 3) || (retWait !== null && retWait >= 3))) return false;
          if (base === 'med') {
            if (outWait !== null && (outWait < 3 || outWait > 6)) return false;
            if (retWait !== null && (retWait < 3 || retWait > 6)) return false;
          }
          if (base === 'long' && ((outWait !== null && outWait <= 6) || (retWait !== null && retWait <= 6))) return false;
          return true;
        } else {
          const wait = getRouteMaxWait(p.outRoute, p.retRoute);
          if (base === 'short' && wait >= 3) return false;
          if (base === 'med' && (wait < 3 || wait > 6)) return false;
          if (base === 'long' && wait <= 6) return false;
          return true;
        }
      })
    : filteredPaths;
  const shown = finalPaths.slice(0, 500);

  for (let pi = 0; pi < shown.length; pi++) {
    const p = shown[pi];
    const out = p.outRoute;
    const ret = p.retRoute;
    const intOutCity = out && out.intCity ? `${t('viaWord')}${cityName(out.intCode, out.intCity)} (${out.intCode})` : '';
    const intRetCity = ret && ret.intCity ? `${t('viaWord')}${cityName(ret.intCode, ret.intCity)} (${ret.intCode})` : '';

    const ow = !p.retRoute;
    const _owW = getLegWait(out);
    const _rwW = getLegWait(ret);
    const _maxW = Math.max(_owW === null ? -1 : _owW, _rwW === null ? -1 : _rwW);
    const _waitBadge = _maxW >= 0 ? ` &bull; ⏱ ${t('waitBadge', { n: fmtWait(_maxW) })}` : '';
    html += `<div class="mc-card" style="border-left:4px solid #d32f2f">
      <div class="mc-card-title" style="color:#d32f2f">#${pi + 1} — ${ow ? t('oneWayLabel') : t('totalLabel')}: <strong style="font-size:1.2rem">${Number(p.total).toFixed(2).replace('.',',')} €</strong></div>
      <div style="font-size:0.8rem;color:var(--text2);margin-bottom:10px">
        <span class="code-badge">${p.destCode}</span> ${cityName(p.destCode, p.destName)} &bull;
        ${fmtDate(p.outDate)}${p.inDate ? ' → ' + fmtDate(p.inDate) : ''}${p.nights ? ' &bull; ' + t('nightsShort', { n: p.nights }) : ''} &bull; ${t('flights')}: ${(out.legs || 1) + (ow ? 0 : (ret.legs || 1))}${_waitBadge}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;background:var(--surface2);border-radius:10px;padding:10px;margin-bottom:8px">
        <div style="font-weight:700;font-size:0.85rem;color:var(--accent);margin-bottom:4px">${t('outbound')}<span style="font-weight:400;color:var(--text2)">${intOutCity}</span></div>`;
    if (out.type === 'direct') {
      const otime = out.dep ? `<span style="font-size:0.75rem;color:var(--green);margin-left:4px">${out.dep}${out.arr ? '-' + out.arr : ''}</span>` : '';
      html += `<div style="display:flex;align-items:center;gap:8px;padding:4px 8px;flex-wrap:wrap">
        <span style="font-weight:600;font-size:0.9rem;min-width:140px">${orgLabel} → ${cityName(p.destCode, p.destName)} (${p.destCode})</span>
        <span style="color:var(--text2);font-size:0.85rem">${fmtDate(p.outDate)}${otime}</span>
        <span style="color:var(--accent);font-weight:600;font-size:0.85rem">${Number(out.price).toFixed(2).replace('.',',')} €</span>
      </div>`;
    } else {
      const t1 = out.dep1 ? `<span style="font-size:0.75rem;color:var(--green);margin-left:4px">${out.dep1}${out.arr1 ? '-' + out.arr1 : ''}</span>` : '';
      const t2 = out.dep2 ? `<span style="font-size:0.75rem;color:var(--green);margin-left:4px">${out.dep2}${out.arr2 ? '-' + out.arr2 : ''}</span>` : '';
      html += `<div style="display:flex;align-items:center;gap:8px;padding:4px 8px;flex-wrap:wrap">
        <span style="font-weight:600;font-size:0.9rem;min-width:140px">${orgLabel} → ${cityName(out.intCode, out.intCity)} (${out.intCode})</span>
        <span style="color:var(--text2);font-size:0.85rem">${fmtDate(p.outDate)}${t1}</span>
        <span style="color:var(--accent);font-weight:600;font-size:0.85rem">${Number(out.leg1Price).toFixed(2).replace('.',',')} €</span>
      </div>
      <div style="text-align:center;color:var(--border);font-size:0.7rem">↓</div>
      <div style="display:flex;align-items:center;gap:8px;padding:4px 8px;flex-wrap:wrap">
        <span style="font-weight:600;font-size:0.9rem;min-width:140px">${cityName(out.intCode, out.intCity)} (${out.intCode}) → ${cityName(p.destCode, p.destName)} (${p.destCode})</span>
        <span style="color:var(--text2);font-size:0.85rem">${fmtDate(out.arrDate)}${t2}</span>
        <span style="color:var(--accent);font-weight:600;font-size:0.85rem">${Number(out.leg2Price).toFixed(2).replace('.',',')} €</span>
        <span style="font-size:0.8rem;color:var(--pink);font-weight:600">${out.type === 'via1n' ? t('oneNight') : t('sameDay')}</span>
      </div>`;
    }
    html += `</div>`;
    if (p.retRoute) {
      html += `<div style="display:flex;flex-direction:column;gap:6px;background:rgba(79,172,254,0.06);border-radius:10px;padding:10px;margin-bottom:8px">
        <div style="font-weight:700;font-size:0.85rem;color:var(--green);margin-bottom:4px">${t('return')}<span style="font-weight:400;color:var(--text2)">${intRetCity}</span></div>`;
      if (ret.type === 'direct') {
        const rt = ret.dep ? `<span style="font-size:0.75rem;color:var(--green);margin-left:4px">${ret.dep}${ret.arr ? '-' + ret.arr : ''}</span>` : '';
        html += `<div style="display:flex;align-items:center;gap:8px;padding:4px 8px;flex-wrap:wrap">
          <span style="font-weight:600;font-size:0.9rem;min-width:140px">${cityName(p.destCode, p.destName)} (${p.destCode}) → ${orgLabel}</span>
          <span style="color:var(--text2);font-size:0.85rem">${fmtDate(p.inDate)}${rt}</span>
          <span style="color:var(--accent);font-weight:600;font-size:0.85rem">${Number(ret.price).toFixed(2).replace('.',',')} €</span>
        </div>`;
      } else {
        const rt1 = ret.dep1 ? `<span style="font-size:0.75rem;color:var(--green);margin-left:4px">${ret.dep1}${ret.arr1 ? '-' + ret.arr1 : ''}</span>` : '';
        const rt2 = ret.dep2 ? `<span style="font-size:0.75rem;color:var(--green);margin-left:4px">${ret.dep2}${ret.arr2 ? '-' + ret.arr2 : ''}</span>` : '';
        html += `<div style="display:flex;align-items:center;gap:8px;padding:4px 8px;flex-wrap:wrap">
          <span style="font-weight:600;font-size:0.9rem;min-width:140px">${cityName(p.destCode, p.destName)} (${p.destCode}) → ${cityName(ret.intCode, ret.intCity)} (${ret.intCode})</span>
          <span style="color:var(--text2);font-size:0.85rem">${fmtDate(ret.depDate)}${rt1}</span>
          <span style="color:var(--accent);font-weight:600;font-size:0.85rem">${Number(ret.leg1Price).toFixed(2).replace('.',',')} €</span>
          <span style="font-size:0.8rem;color:var(--pink);font-weight:600">${ret.type === 'via1n' ? t('oneNight') : t('sameDay')}</span>
        </div>
        <div style="text-align:center;color:var(--border);font-size:0.7rem">↓</div>
        <div style="display:flex;align-items:center;gap:8px;padding:4px 8px;flex-wrap:wrap">
          <span style="font-weight:600;font-size:0.9rem;min-width:140px">${cityName(ret.intCode, ret.intCity)} (${ret.intCode}) → ${orgLabel}</span>
          <span style="color:var(--text2);font-size:0.85rem">${fmtDate(p.inDate)}${rt2}</span>
          <span style="color:var(--accent);font-weight:600;font-size:0.85rem">${Number(ret.leg2Price).toFixed(2).replace('.',',')} €</span>
        </div>`;
      }
      html += `</div>`;
    }
    html += `<div style="text-align:center;font-size:0.95rem;color:var(--text2)">
      ${t('outgoing')}: <strong>${Number(out.price).toFixed(2).replace('.',',')} €</strong>${ret ? ` &nbsp;+&nbsp; ${t('inbound')}: <strong>${Number(ret.price).toFixed(2).replace('.',',')} €</strong>` : ''}
      &nbsp;=&nbsp; <strong style="color:var(--pink);font-size:1.1rem">${Number(p.total).toFixed(2).replace('.',',')} €</strong>
    </div>`;
    html += `</div>`;
  }
  if (finalPaths.length > 500) html += `<div style="text-align:center;padding:16px;color:var(--text2);font-size:0.9rem">${t('showing500', { n: finalPaths.length })}</div>`;
  content.innerHTML = html;
  document.getElementById('resultsInfo').textContent = t('mcRoutesFor', { n: finalPaths.length, dest: destLabel });
  document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* --- Search --- */

async function search() {
  if (document.getElementById('multiDestMode').checked) {
    return searchMultiDestination();
  }
  try {
  if (isSearching) return;

  const dateFrom = document.getElementById('dateFrom').value;
  const dateTo = document.getElementById('dateTo').value;
  let minN = Math.max(1, Math.min(30, parseInt(document.getElementById('minNights').value) || 2));
  let maxN = Math.max(minN, Math.min(30, parseInt(document.getElementById('maxNights').value) || 5));
  const wk = document.getElementById('weekendOnly').checked;

  if (!dateFrom || !dateTo) return alert(t('pickDates'));
  if (selectedDestinations.size === 0) return alert(t('pickDestPlural'));

  const dFrom = new Date(dateFrom + 'T00:00:00');
  const dTo = new Date(dateTo + 'T00:00:00');
  if (dFrom >= dTo) return alert(t('dateOrder'));

  simpleFilterNights = 'ALL';
  searchCancelled = false;

  isSearching = true;
  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = t('searching');

  setCacheDot('loading', t('fetching'));
  const content = document.getElementById('resultsContent');
  content.innerHTML = `<div class="loading"><div class="spinner"></div><div class="progress-text" id="progText">${t('fetchingReal')}</div><div class="progress-bar"><div class="progress-bar-fill" id="progBar" style="width:0%"></div></div><div style="margin-top:14px"><button class="btn btn-secondary" id="cancelBtn" onclick="cancelSearch()" style="padding:8px 20px;font-size:0.8rem">${t('cancel')}</button></div><div class="skel-wrap"><div class="skel skel-line"></div><div class="skel skel-card"></div><div class="skel skel-card"></div></div></div>`;
  document.getElementById('resultsInfo').textContent = '';

  const destList = allDestinations.filter(d => selectedDestinations.has(d.code));
  const total = destList.length;
  const months = getMonthsInRange(dFrom, dTo);
  const monthDelay = months.length > 6 ? 200 : 0;
  const faresData = {};
  const results = [];

  for (let di = 0; di < destList.length; di++) {
    if (searchCancelled) return finishCancelled();
    const dest = destList[di];
    const pct = (di / total) * 100;
    const pt = document.getElementById('progText');
    const pb = document.getElementById('progBar');
    if (pt) pt.textContent = `[${di+1}/${total}] ${cityName(dest.code, dest.city)} (${dest.code})...`;
    if (pb) pb.style.width = pct + '%';

    const ow = isOneWay();
    const oMap = {}, iMap = {};
    let hasData = false;

    for (const m of months) {
      if (searchCancelled) return finishCancelled();
      const oProm = fetchFares(currentOrigin, dest.code, m).catch(() => []);
      const iProm = ow ? Promise.resolve([]) : fetchFares(dest.code, currentOrigin, m).catch(() => []);
      const [o, n] = await Promise.all([oProm, iProm]);
      for (const f of o) { const dt = new Date(f.day + 'T00:00:00'); if (dt >= dFrom && dt <= dTo) { oMap[f.day] = { price: f.price.value, dep: f.departureDate ? f.departureDate.substring(11,16) : null, arr: f.arrivalDate ? f.arrivalDate.substring(11,16) : null }; hasData = true; } }
      if (!ow) for (const f of n) { const dt = new Date(f.day + 'T00:00:00'); if (dt >= dFrom && dt <= dTo) { iMap[f.day] = { price: f.price.value, dep: f.departureDate ? f.departureDate.substring(11,16) : null, arr: f.arrivalDate ? f.arrivalDate.substring(11,16) : null }; hasData = true; } }
      if (monthDelay) await new Promise(r => setTimeout(r, monthDelay));
    }

    /* retry once if no data at all */
    if (!hasData && !searchCancelled) {
      if (pt) pt.textContent = `[${di+1}/${total}] ${cityName(dest.code, dest.city)} — ${t('retry')}...`;
      await new Promise(r => setTimeout(r, 2000));
      for (const m of months) {
        if (searchCancelled) return finishCancelled();
        const oProm = fetchFares(currentOrigin, dest.code, m).catch(() => []);
        const iProm = ow ? Promise.resolve([]) : fetchFares(dest.code, currentOrigin, m).catch(() => []);
        const [o, n] = await Promise.all([oProm, iProm]);
        for (const f of o) { const dt = new Date(f.day + 'T00:00:00'); if (dt >= dFrom && dt <= dTo) { oMap[f.day] = { price: f.price.value, dep: f.departureDate ? f.departureDate.substring(11,16) : null, arr: f.arrivalDate ? f.arrivalDate.substring(11,16) : null }; hasData = true; } }
        if (!ow) for (const f of n) { const dt = new Date(f.day + 'T00:00:00'); if (dt >= dFrom && dt <= dTo) { iMap[f.day] = { price: f.price.value, dep: f.departureDate ? f.departureDate.substring(11,16) : null, arr: f.arrivalDate ? f.arrivalDate.substring(11,16) : null }; hasData = true; } }
        if (monthDelay) await new Promise(r => setTimeout(r, monthDelay));
      }
    }

    faresData[dest.code] = { outbound: oMap, inbound: iMap };

    if (hasData) {
      if (ow) {
        for (const [od, op] of Object.entries(oMap)) {
          results.push({ destCode: dest.code, destName: cityName(dest.code, dest.city), outDate: od, inDate: null, nights: 0, outPrice: op.price, inPrice: 0, total: op.price, outDep: op.dep, outArr: op.arr, inDep: null, inArr: null });
        }
      } else {
        for (const [od, op] of Object.entries(oMap)) {
          const odd = new Date(od + 'T00:00:00');
          for (const [id, ip] of Object.entries(iMap)) {
            const idd = new Date(id + 'T00:00:00');
            const nn = daysBetween(odd, idd);
            if (nn >= minN && nn <= maxN && (!wk || coversWeekend(odd, idd))) {
              results.push({ destCode: dest.code, destName: cityName(dest.code, dest.city), outDate: od, inDate: id, nights: nn, outPrice: op.price, inPrice: ip.price, total: op.price + ip.price, outDep: op.dep, outArr: op.arr, inDep: ip.dep, inArr: ip.arr });
            }
          }
        }
      }
    }
  }

  /* update progress */
  const pt = document.getElementById('progText');
  const pb = document.getElementById('progBar');
  if (pt) pt.textContent = t('calcMulti');
  if (pb) pb.style.width = '100%';

  if (searchCancelled) return finishCancelled();

  results.sort((a, b) => a.total - b.total);

  /* multi-city (only for round-trip) */
  lastResults = [];
  lastMcResults = [];
  const mcResults = [];
  if (!isOneWay() && results.length > 0 && !searchCancelled) {
    const candidates = results.slice(0, Math.min(results.length, 10));
    for (let ci = 0; ci < candidates.length; ci += 2) {
      if (searchCancelled) return finishCancelled();
      const batch = candidates.slice(ci, ci + 2);
      const br = await Promise.allSettled(batch.map(async (r) => {
        const inDt = new Date(r.inDate + 'T00:00:00');
        let bestB = { price: Infinity, code: null, city: null, dep: null, arr: null };
        for (const d of destList) {
          if (d.code === r.destCode) continue;
          const f = faresData[d.code];
          if (!f || !f.inbound) continue;
          const p = f.inbound[r.inDate];
          if (p && p.price !== undefined && p.price < bestB.price) bestB = { price: p.price, code: d.code, city: d.city, dep: p.dep, arr: p.arr };
        }
        if (!bestB.code || bestB.price >= r.inPrice) return null;

        for (const offset of [1, 2]) {
          const connDt = addDays(inDt, -offset);
          if (connDt <= new Date(r.outDate + 'T00:00:00')) continue;
          const cd = formatDate(connDt);
          let ab = null, connDep = null, connArr = null;
          try {
            const faresAB = await fetchFares(r.destCode, bestB.code, connDt);
            const found = faresAB.find(f => f.day === cd);
            if (found && found.price && found.price.value != null) { ab = found.price.value; connDep = found.departureDate ? found.departureDate.substring(11,16) : null; connArr = found.arrivalDate ? found.arrivalDate.substring(11,16) : null; }
          } catch {}
          if (ab === null) continue;
          const mcTotal = r.outPrice + ab + bestB.price;
          if (mcTotal >= r.total) continue;
          return {
            destCode: r.destCode, destName: r.destName,
            outDate: r.outDate, inDate: r.inDate, nights: r.nights,
            outPrice: r.outPrice, inPrice: bestB.price,
            total: mcTotal, multiCity: true,
            viaCode: bestB.code, viaCity: bestB.city,
            connDate: cd, connPrice: ab,
            directReturn: r.inPrice, directTotal: r.total,
            outDep: r.outDep, outArr: r.outArr,
            connDep: connDep, connArr: connArr,
            inDep: bestB.dep, inArr: bestB.arr
          };
        }
        return null;
      }));
      for (const res of br) {
        if (res.status === 'fulfilled' && res.value) mcResults.push(res.value);
      }
    }
  }

  lastResults = results;
  lastMcResults = mcResults;
  lastFaresData = faresData;
  setCacheDot('fresh', t('updated', { time: new Date().toLocaleString(currentLang === 'el' ? 'el-GR' : 'en-GB'), n: destList.length }));
  renderResults();

  isSearching = false;
  btn.disabled = false;
  btn.textContent = t('search');
  } catch (e) {
    isSearching = false;
    const btn = document.getElementById('searchBtn');
    if (btn) { btn.disabled = false; btn.textContent = t('search'); }
    const content = document.getElementById('resultsContent');
    if (content) content.innerHTML = `<div class="error-msg">${t('error')}: ${e.message}</div>`;
    setCacheDot('empty', t('error'));
  }
}

/* --- Render / re-sort --- */

function renderResults() {
  const sortBy = document.getElementById('sortBy').value;
  const content = document.getElementById('resultsContent');
  const mcCount = lastMcResults.length;
  let displayResults = [...lastResults];
  const ow = displayResults.length > 0 && displayResults[0].inDate === null;

  const nightsSel = document.getElementById('simpleNightsFilter');
  if (nightsSel) {
    if (!ow && lastResults.length > 0) {
      const nightsSet = [...new Set(lastResults.map(r => r.nights).filter(n => n > 0))].sort((a, b) => a - b);
      nightsSel.innerHTML = `<option value="ALL">${t('wheelAllNights')}</option>${nightsSet.map(n => `<option value="${n}" ${simpleFilterNights === String(n) ? 'selected' : ''}>${t('nightsShort', { n })}</option>`).join('')}`;
      nightsSel.style.display = '';
    } else {
      nightsSel.style.display = 'none';
      simpleFilterNights = 'ALL';
    }
  }

  if (!ow && simpleFilterNights !== 'ALL') {
    displayResults = displayResults.filter(r => String(r.nights) === simpleFilterNights);
  }

  if (sortBy === 'date') {
    displayResults.sort((a, b) => a.outDate.localeCompare(b.outDate) || a.total - b.total);
  }
  const regularCount = displayResults.length;
  const sortLabel = sortBy === 'price' ? t('cheapestPlural', { n: displayResults.length }) : t('closestDates', { n: displayResults.length });
  document.getElementById('resultsInfo').textContent = `${ow ? t('oneWayDash') : ''}${ow ? t('foundFlights', { n: regularCount }) : t('foundCombos', { n: regularCount })}${!ow && mcCount > 0 ? t('multiCityAdd', { n: mcCount }) : ''} — ${sortLabel}`;

  if (displayResults.length === 0 && mcCount === 0) {
    const hasData = lastResults.length > 0 || lastMcResults.length > 0;
    content.innerHTML = `<div class="empty-msg"><div class="big-icon">&#128533;</div><p>${t('noResults')}</p><p style="color:#666;font-size:0.9rem;margin-top:8px">${hasData ? t('tryOtherDates') : t('noApiData')}</p></div>`;
  } else {
    let html = '';
    /* calendar view only for round-trip */
    if (!ow && Object.keys(lastFaresData).length > 0) {
      const rtMap = {};
      for (const r of lastResults) {
        const key = r.destCode + '|' + r.outDate;
        if (!rtMap[key] || r.total < rtMap[key].total) rtMap[key] = { total: r.total, nights: r.nights };
      }
      const dateSet = new Set();
      const calDestCodes = [];
      for (const [code, data] of Object.entries(lastFaresData)) {
        if (!data || Object.keys(data.outbound).length === 0 && Object.keys(data.inbound).length === 0) continue;
        calDestCodes.push(code);
        for (const d of Object.keys(data.outbound)) dateSet.add(d);
      }
      const calDates = [...dateSet].sort();
      if (calDates.length > 0 && calDestCodes.length > 0) {
        html += `<div class="cal-section"><h3>${t('calTitle')}</h3><div class="cal-scroll"><table class="cal-table"><thead><tr><th>${t('cities')}</th>${calDates.map(d => {
          const day = new Date(d).getDay();
          const names = I18N.dayNames[currentLang];
          const cls = day === 0 || day === 6 ? ' cal-date-wknd' : '';
          return `<th class="cal-date${cls}"><span class="day-name">${names[day]}</span>${fmtDate(d)}</th>`;
        }).join('')}</tr></thead><tbody>`;
        for (const code of calDestCodes) {
          const dest = allDestinations.find(d => d.code === code);
          let minTotal = Infinity, maxTotal = -Infinity;
          for (const d of calDates) {
            const rt = rtMap[code + '|' + d];
            if (rt) {
              if (rt.total < minTotal) minTotal = rt.total;
              if (rt.total > maxTotal) maxTotal = rt.total;
            }
          }
          html += `<tr><td class="cal-dest">${dest ? `${cityName(code, dest.city)} (${code})` : code}</td>`;
          for (const d of calDates) {
            const rt = rtMap[code + '|' + d];
            if (rt) {
              let cls = 'cal-cell';
              if (rt.total === minTotal && minTotal < Infinity) cls += ' cal-min';
              if (rt.total === maxTotal && maxTotal > -Infinity && minTotal !== maxTotal) cls += ' cal-max';
              html += `<td class="${cls}">${Number(rt.total).toFixed(0).replace('.',',')}€<span class="cal-nights">${t('nightsShort', { n: rt.nights })}</span></td>`;
            } else {
              html += `<td class="cal-cell cal-empty">-</td>`;
            }
          }
          html += `</tr>`;
        }
        html += `</tbody></table></div></div>`;
      }
    }
    if (displayResults.length > 0) {
      const colHeaders = ow
        ? `<th>#</th><th>${t('destCol')}</th><th>${t('depCol')}</th><th>${t('totalCol')}</th>`
        : `<th>#</th><th>${t('destCol')}</th><th>${t('depCol')}</th><th>${t('retCol')}</th><th>${t('nightsCol')}</th><th>${t('outCol')}</th><th>${t('inCol')}</th><th>${t('totalCol')}</th>`;
      html += `<div class="table-wrap"><table><thead><tr>${colHeaders}</tr></thead><tbody>${displayResults.map((r, i) => {
        const rc = i < 3 ? `rank-${i+1}` : 'rank-other';
        const outTime = r.outDep ? `<span style="font-size:0.75rem;color:var(--green);display:inline-block;margin-left:4px">${r.outDep}${r.outArr ? '-' + r.outArr : ''}</span>` : '';
        const inTime = r.inDep ? `<span style="font-size:0.75rem;color:var(--green);display:inline-block;margin-left:4px">${r.inDep}${r.inArr ? '-' + r.inArr : ''}</span>` : '';
        if (ow) {
          return `<tr><td><span class="rank-badge ${rc}">${i+1}</span></td><td><div class="dest-cell"><span class="code-badge">${r.destCode}</span> ${cityName(r.destCode, r.destName)}</div></td><td>${fmtDate(r.outDate)}${outTime}</td><td class="price-total">${Number(r.total).toFixed(2).replace('.',',')} €</td></tr>`;
        }
        return `<tr><td><span class="rank-badge ${rc}">${i+1}</span></td><td><div class="dest-cell"><span class="code-badge">${r.destCode}</span> ${cityName(r.destCode, r.destName)}</div></td><td>${fmtDate(r.outDate)}${outTime}</td><td>${fmtDate(r.inDate)}${inTime}</td><td><span class="nights-badge">${r.nights}</span></td><td class="price">${Number(r.outPrice).toFixed(2).replace('.',',')} €</td><td class="price">${Number(r.inPrice).toFixed(2).replace('.',',')} €</td><td class="price-total">${Number(r.total).toFixed(2).replace('.',',')} €</td></tr>`;
      }).join('')}</tbody></table></div>`;
    }
    if (!ow && mcCount > 0) {
      html += `<div class="mc-section"><h3 style="margin:16px 0 10px;font-size:1rem;color:var(--accent)">${t('mcProposals')}</h3>${lastMcResults.map((r, i) => {
        const saved = r.directTotal - r.total;
        const ot = r.outDep ? `<span style="font-size:0.7rem;color:var(--green);margin-left:3px">${r.outDep}${r.outArr?'-'+r.outArr:''}</span>` : '';
        const ct = r.connDep ? `<span style="font-size:0.7rem;color:var(--green);margin-left:3px">${r.connDep}${r.connArr?'-'+r.connArr:''}</span>` : '';
        const it = r.inDep ? `<span style="font-size:0.7rem;color:var(--green);margin-left:3px">${r.inDep}${r.inArr?'-'+r.inArr:''}</span>` : '';
        return `<div class="mc-card">
          <div class="mc-card-title">#${i+1} — ${cityName(r.destCode, r.destName)} (${r.destCode}) <span class="mc-label">MC</span></div>
          <div class="mc-legs">
            <div class="mc-leg"><span class="mc-route">${currentOrigin} → ${cityName(r.destCode, r.destName)} (${r.destCode})</span><span class="mc-date">${fmtDate(r.outDate)}${ot}</span><span class="mc-price">${Number(r.outPrice).toFixed(2).replace('.',',')} €</span></div>
            <div class="mc-arrow">↓</div>
            <div class="mc-leg mc-mid"><span class="mc-route">${r.destCode} → ${cityName(r.viaCode, r.viaCity)} (${r.viaCode})</span><span class="mc-date">${fmtDate(r.connDate)}${ct}</span><span class="mc-price">${Number(r.connPrice).toFixed(2).replace('.',',')} €</span></div>
            <div class="mc-arrow">↓</div>
            <div class="mc-leg"><span class="mc-route">${r.viaCode} → ${currentOrigin}</span><span class="mc-date">${fmtDate(r.inDate)}${it}</span><span class="mc-price">${Number(r.inPrice).toFixed(2).replace('.',',')} €</span></div>
          </div>
          <div class="mc-compare"><span class="mc-strikethrough">${r.destCode}→${currentOrigin}: ${Number(r.directReturn).toFixed(2).replace('.',',')} €</span>&ensp;↦&ensp;<span class="mc-via-route">${r.destCode}→${r.viaCode} + ${r.viaCode}→${currentOrigin}: ${Number(r.connPrice + r.inPrice).toFixed(2).replace('.',',')} €</span> <span class="mc-saved">(${t('saving', { n: Number(saved).toFixed(2).replace('.',',') })})</span></div>
          <div class="mc-total">${t('totalLabel')}: <strong>${Number(r.total).toFixed(2).replace('.',',')} €</strong></div>
        </div>`;
      }).join('')}</div>`;
    }
    content.innerHTML = html;
  }
}

function filterSimpleNights() {
  const sel = document.getElementById('simpleNightsFilter');
  if (sel) simpleFilterNights = sel.value;
  renderResults();
}

function reSortResults() {
  if (document.getElementById('sortSelect')) return; /* multi-dest results shown */
  renderResults();
}

function filterWheelDest() {
  const sel = document.getElementById('wheelDestFilter');
  if (sel) wheelFilterDest = sel.value;
  reSortMultiDest();
}

function filterWheelNights() {
  const sel = document.getElementById('wheelNightsFilter');
  if (sel) wheelFilterNights = sel.value;
  reSortMultiDest();
}

function filterWheelWait() {
  const sel = document.getElementById('wheelWaitFilter');
  if (sel) wheelFilterWait = sel.value;
  reSortMultiDest();
}

function reSortMultiDest() {
  if (!lastMultiDestPaths) return;
  const sel = document.getElementById('sortSelect');
  if (!sel) return displayMultiDestResults(lastMultiDestPaths, lastMultiDestCityNames, lastMultiDestDays, lastMultiDestOrigin);
  const sortVal = sel.value;
  let sorted;
  if (sortVal === 'outdate') {
    sorted = [...lastMultiDestPaths].sort((a, b) => a.outDate.localeCompare(b.outDate) || a.total - b.total);
  } else if (sortVal === 'nights') {
    sorted = [...lastMultiDestPaths].sort((a, b) => a.nights - b.nights || a.total - b.total);
  } else {
    sorted = [...lastMultiDestPaths].sort((a, b) => a.total - b.total);
  }
  displayMultiDestResults(sorted, lastMultiDestCityNames, lastMultiDestDays, lastMultiDestOrigin);
}

/* --- Init --- */

function initApp() {
  setCacheDot('empty', t('init'));
  setLang(currentLang);
  try {
    if (localStorage.getItem('rfpFiltersCollapsed') === '1') toggleFilters(true);
  } catch (e) {}
}

initApp();
</script>
