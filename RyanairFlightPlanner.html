<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="LowcostFlightPlanner — αναζήτηση φθηνών πτήσεων Ryanair, round-trip, one-way και multi-destination.">
  <title>LowcostFlightPlanner - Multi-Destination</title>
  <link rel="stylesheet" href="style.css?v=filters1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23d946ef'/><stop offset='.5' stop-color='%23ec4899'/><stop offset='1' stop-color='%23fb923c'/></linearGradient></defs><rect width='64' height='64' rx='15' fill='url(%23g)'/><path d='M51 13 L13 30 L29 36 L35 51 Z' fill='%23fff'/><path d='M51 13 L35 51 L29 36 Z' fill='%23fff' opacity='.72'/></svg>">
</head>
<body>
  <div class="bg-decor" aria-hidden="true"><i></i><i></i><i></i></div>
<svg class="svg-defs" aria-hidden="true" focusable="false"><defs><linearGradient id="planeGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d946ef"/><stop offset=".5" stop-color="#ec4899"/><stop offset="1" stop-color="#fb923c"/></linearGradient></defs></svg>

  <div class="container">
    <header>
      <div class="header-topbar">
        <button class="help-btn" id="helpBtn" onclick="openHelpModal()" data-i18n="helpBtn">Βοήθεια / Οδηγίες</button>
        <div class="header-flags">
          <button class="lang-btn" id="flagEl" onclick="setLang('el')" title="Ελληνικά" aria-label="Ελληνικά">
            <svg width="24" height="16" viewBox="0 0 27 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect width="27" height="18" fill="#ffffff"/><rect y="0" width="27" height="2" fill="#0D5EAF"/><rect y="4" width="27" height="2" fill="#0D5EAF"/><rect y="8" width="27" height="2" fill="#0D5EAF"/><rect y="12" width="27" height="2" fill="#0D5EAF"/><rect y="16" width="27" height="2" fill="#0D5EAF"/><rect width="10" height="10" fill="#0D5EAF"/><rect x="4" y="0" width="2" height="10" fill="#ffffff"/><rect x="0" y="4" width="10" height="2" fill="#ffffff"/>
            </svg>
          </button>
          <button class="lang-btn" id="flagEn" onclick="setLang('en')" title="English" aria-label="English">
            <svg width="32" height="16" viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <clipPath id="ukS"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
              <clipPath id="ukT"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
              <g clip-path="url(#ukS)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#ffffff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukT)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#ffffff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g>
            </svg>
          </button>
        </div>
      </div>

      <h1>LowcostFlightPlanner</h1>

      <div class="city-selector">
        <label class="field-label" for="originSelect" data-i18n="origin">Αφετηρία:</label>
        <select class="origin-select" id="originSelect" onchange="onOriginChange()"></select>
      </div>

      <div class="badge" data-i18n="badge">Πραγματικές τιμές • Τιμές σε EUR • Auto-refresh</div>
    </header>

    <div id="proxyInfo" class="cache-info is-centered">
      <span class="dot is-loading" id="proxyDot" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></span>
      <span data-i18n-html="true" data-i18n="proxyInfo">Λήψη πραγματικών τιμών μέσω proxy • </span><span id="proxyStatus">Αρχικοποίηση...</span>
    </div>

    <section class="panel filters" id="filtersSection">
      <div class="filter-toolbar">
        <button class="btn btn-secondary btn-mini" id="clearFiltersBtn" onclick="clearAllFilters()" data-i18n="clearFilters">Καθαρισμός Φίλτρων</button>
        <button class="btn btn-secondary btn-mini" id="filterToggleBtn" onclick="toggleFilters()" data-i18n="hideFilters">Απόκρυψη φίλτρων ▲</button>
      </div>

      <div class="filter-grid">
        <div class="filter-group trip-type">
          <span class="field-label" data-i18n="type">Τύπος:</span>
          <div class="seg" role="radiogroup">
            <label>
              <input type="radio" name="tripType" value="roundtrip" checked onchange="onTripTypeChange()">
              <span data-i18n="roundtrip">Με επιστροφή</span>
            </label>
            <label>
              <input type="radio" name="tripType" value="oneway" onchange="onTripTypeChange()">
              <span data-i18n="oneway">Μονή διαδρομή</span>
            </label>
          </div>
        </div>

        <div class="filter-group">
          <label for="dateFrom" data-i18n="dateFrom">Από ημερομηνία</label>
          <input type="date" id="dateFrom">
        </div>

        <div class="filter-group">
          <label for="dateTo" data-i18n="dateTo">Έως ημερομηνία</label>
          <input type="date" id="dateTo">
        </div>

        <div class="filter-group" id="nightsFilter">
          <label data-i18n="nights">Διανυκτερεύσεις</label>
          <div class="range-row">
            <input type="number" id="minNights" min="1" max="30" value="2" aria-label="min nights">
            <span data-i18n="to">έως</span>
            <input type="number" id="maxNights" min="1" max="30" value="5" aria-label="max nights">
          </div>
        </div>

        <div class="filter-group checkbox-group" id="weekendFilter">
          <input type="checkbox" id="weekendOnly">
          <label for="weekendOnly" data-i18n="weekend">Να περιλαμβάνει Σαββατοκύριακο</label>
        </div>

        <div class="mcp">
          <div class="mcp-head">
            <input type="checkbox" id="multiDestMode" onchange="onMultiDestToggle()">
            <label for="multiDestMode" data-i18n="multiDest">Multi-Destination</label>
            <span class="mcp-chip">CONNECT</span>
          </div>
          <div class="mcp-sub is-hidden" id="wheelOfFortuneRow">
            <input type="checkbox" id="wheelOfFortune" onchange="onWheelOfFortuneToggle()">
            <label for="wheelOfFortune"><span class="wheel-text" data-i18n="wheelOfFortuneLabel">Τροχός της τύχης</span></label>
            <span class="mcp-hint" data-i18n="wheelHint">Όλοι οι προορισμοί αυτόματα</span>
          </div>
        </div>
      </div>

      <div class="destinations-section">
        <div class="destinations-header">
          <span class="count" id="destCount">Φόρτωση προορισμών...</span>
          <div class="destinations-actions" id="destActions">
            <button class="btn btn-secondary btn-mini" onclick="selectAllDestinations(true)" data-i18n="selectAll">Επιλογή όλων</button>
            <button class="btn btn-secondary btn-mini" onclick="selectAllDestinations(false)" data-i18n="clear">Αποεπιλογή</button>
          </div>
        </div>
        <div class="destinations-grid" id="destGrid">
          <div class="loading"><div class="plane-loader" aria-hidden="true"><span class="plane-ping"></span><span class="plane-ping plane-ping-late"></span><svg class="plane-icon" viewBox="0 0 24 24"><path fill="url(#planeGrad)" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></div></div>
        </div>
      </div>

      <div id="cacheInfo" class="cache-info is-centered">
        <span class="dot is-empty" id="cacheDot" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></span>
        <span id="cacheText">Αρχικοποίηση...</span>
      </div>

      <div class="search-row">
        <button class="btn btn-primary" id="searchBtn" onclick="search()" data-i18n="search">Αναζήτηση</button>
      </div>
    </section>

    <section class="panel results" id="resultsSection">
      <div class="results-header">
        <h2 data-i18n="results">Αποτελέσματα</h2>
        <div class="results-controls">
          <select id="sortBy" onchange="reSortResults()" aria-label="sort">
            <option value="price" data-i18n="cheapest">Φθηνότερα</option>
            <option value="date" data-i18n="depDate">Ημερομηνία αναχώρησης</option>
          </select>
          <select id="simpleNightsFilter" class="is-hidden" onchange="filterSimpleNights()" aria-label="nights">
            <option value="ALL" data-i18n="wheelAllNights">Όλες οι διανυκτερεύσεις</option>
          </select>
          <select id="simpleCityFilter" class="is-hidden" onchange="filterSimpleCity()" aria-label="city">
            <option value="ALL" data-i18n="cityAll">Όλες οι πόλεις</option>
          </select>
          <select id="simpleWaitFilter" class="is-hidden" onchange="filterSimpleWait()" aria-label="wait">
            <option value="ALL" data-i18n="waitAll">Όλες οι αναμονές</option>
            <option value="1-3" data-i18n="wait1to3">1-3 ώρες</option>
            <option value="3-6" data-i18n="wait3to6">3-6 ώρες</option>
            <option value="6-9" data-i18n="wait6to9">6-9 ώρες</option>
            <option value="9+">9+ ώρες</option>
          </select>
          <span class="info" id="resultsInfo"></span>
        </div>
      </div>
      <div id="resultsContent">
        <div class="empty-msg">
          <div class="big-icon">&#9992;</div>
          <p data-i18n="emptyInit">Επιλέξτε προορισμούς και πατήστε "Αναζήτηση"</p>
        </div>
      </div>
    </section>
  </div>

  <div class="help-modal-overlay" id="helpModal" onclick="if(event.target===this)closeHelpModal()">
    <div class="help-modal-box" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <button class="help-modal-close" onclick="closeHelpModal()" aria-label="Close">✕</button>
      <h2 id="helpTitle" data-i18n="helpTitle">Βοήθεια / Οδηγίες</h2>
      <div class="help-body" data-i18n-html="true" data-i18n="helpBody"></div>
    </div>
  </div>

  <script src="app.js?v=filters1"></script>
</body>
</html>
